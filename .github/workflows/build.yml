
name: Build RivalSMP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify plugin contents
        run: |
          jar tf target/RivalSMP-1.21.1-to-1.21.11.jar | grep -E '^(plugin.yml|com/rivalsmp/RivalSMP.class)$'

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RivalSMP-1.21.1-to-1.21.11
          path: target/RivalSMP-1.21.1-to-1.21.11.jar
          if-no-files-found: error
